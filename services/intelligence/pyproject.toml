[project]
name = "fasalytics-intelligence"
version = "0.1.0"
description = "FASALYTICS intelligence service (FastAPI): forecasting, risk, scenarios and allocation. Milestone 7 foundation: infrastructure only, no models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
    "ruff==0.17.0",
]

# This service is run from its own directory (python -m app); it is not built or published.
# Exact, fully-resolved versions (including transitive packages) live in requirements.lock.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and bind to loopback.
"tests/**" = ["S101", "S104"]

[tool.ruff.format]
quote-style = "double"
